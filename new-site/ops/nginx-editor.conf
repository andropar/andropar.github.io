location = /admin { return 302 /admin/; }
location ^~ /admin/ {
    auth_basic "Writing editor";
    auth_basic_user_file /etc/nginx/.editor-htpasswd;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri $uri/ =404;
}
location = /admin/api/v1 {
    auth_basic "Writing editor";
    auth_basic_user_file /etc/nginx/.editor-htpasswd;
    if ($editor_origin_allowed = 0) { return 403; }
    limit_req zone=editor_api burst=30 nodelay;
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:8085/api/v1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization "";
    proxy_read_timeout 30s;
    access_log off;
}
