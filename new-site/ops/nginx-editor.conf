location = /admin { return 302 /blog/admin/; }
location ^~ /admin/ { return 302 /blog/admin/; }
location = /blog/admin { return 302 /blog/admin/; }
location = /blog/admin/login {
    limit_req zone=editor_login burst=5 nodelay;
    limit_req_status 429;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8085/blog/admin/login;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
}
location = /blog/admin/logout {
    proxy_pass http://127.0.0.1:8085/blog/admin/logout;
    proxy_set_header Host $host;
}
location = /blog/admin/auth-check {
    internal;
    proxy_pass http://127.0.0.1:8085/blog/admin/auth-check;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
}
location ^~ /blog/admin/ {
    auth_request /blog/admin/auth-check;
    error_page 401 =302 /blog/admin/login;
    add_header Cache-Control "no-store" always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    try_files $uri $uri/ =404;
}
location = /blog/admin/api/v1 {
    auth_request /blog/admin/auth-check;
    error_page 401 = @editor_signed_out;
    if ($editor_origin_allowed = 0) { return 403; }
    limit_req zone=editor_api burst=30 nodelay;
    client_max_body_size 15m;
    proxy_pass http://127.0.0.1:8085/api/v1;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
    access_log off;
}
location @editor_signed_out {
    default_type application/json;
    return 401 '{"error":"Sign in to the writing editor."}';
}
