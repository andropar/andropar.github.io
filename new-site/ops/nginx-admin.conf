server {
    listen 80;
    listen [::]:80;
    server_name admin.jroth.space;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://admin.jroth.space$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name admin.jroth.space;
    root /srv/jroth.space/current;
    index index.html;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/admin.jroth.space/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.jroth.space/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Content-Type-Options nosniff always;
    include /etc/nginx/snippets/personal-editor.conf;
    limit_req zone=website burst=100 nodelay;
    limit_req_status 429;
    limit_conn per_ip 50;
    client_body_timeout 15s;
    client_header_timeout 15s;
    location = / { return 302 /admin/; }
    location / { return 404; }
}
